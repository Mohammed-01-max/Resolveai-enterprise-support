# ============================================================
# Spring AI - Gemini via AI Studio (OpenAI-compatible endpoint)
# Set GEMINI_API_KEY as an environment variable before running
# ============================================================


# 1. Point the base URL to the root Google domain
spring.ai.openai.base-url=https://generativelanguage.googleapis.com

# 2. Override the default OpenAI path with the exact Gemini endpoint path
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions

# 3. Credentials and Model
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-2.5-flash


# ============================================================
# MySQL DataSource
# Start MySQL with: docker run --name mysql-order-db \
#   -e MYSQL_ROOT_PASSWORD=root \
#   -e MYSQL_DATABASE=orderdb \
#   -e MYSQL_USER=admin \
#   -e MYSQL_PASSWORD=admin123 \
#   -p 3306:3306 -d mysql:8.0
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# Flyway — migrations run automatically from db/migration/
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# Verbose Logging — see exactly what Spring AI + Claude do
# ============================================================

# Your own service classes — DEBUG shows every @Tool call
logging.level.com.shopeasy.agent=DEBUG

# Spring AI internals — see how it builds prompts and calls tools
logging.level.org.springframework.ai=DEBUG

# HTTP calls to Gemini API (request/response bodies)
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Hibernate SQL with bind parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Spring Web — see every incoming REST request
logging.level.org.springframework.web=DEBUG

# DataSource connection pool
logging.level.com.zaxxer.hikari=DEBUG

# Spring context startup — see beans being registered
logging.level.org.springframework.context=INFO

# Log format: timestamp | level | logger | message
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan(%-40.40logger{39}) : %msg%n
