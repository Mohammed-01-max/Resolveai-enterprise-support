  <line x1="240" y1="298" x2="306" y2="358" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#a-blue)"/>
  <text x="264" y="323" text-anchor="middle" font-size="8" fill="#3B82F6">SSE</text>
  <line x1="435" y1="376" x2="435" y2="390" stroke="#22C55E" stroke-width="1.5" marker-end="url(#a-green)"/>
  <line x1="435" y1="442" x2="435" y2="456" stroke="#22C55E" stroke-width="1.5" marker-end="url(#a-green)"/>
  <line x1="428" y1="262" x2="628" y2="185" stroke="#F97316" stroke-width="1.8" marker-end="url(#a-orange)"/>
  <text x="540" y="215" text-anchor="middle" font-size="8" fill="#F97316">JPA</text>
  <line x1="564" y1="262" x2="628" y2="205" stroke="#F97316" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <line x1="564" y1="490" x2="628" y2="240" stroke="#F97316" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a-orange)"/>
  <text x="614" y="360" font-size="8" fill="#F97316">JPA</text>
  <line x1="739" y1="278" x2="739" y2="258" stroke="#F97316" stroke-width="1.5" marker-end="url(#a-orange)"/>
  <line x1="435" y1="528" x2="435" y2="545" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#a-purple)"/>
  <text x="454" y="539" font-size="8" fill="#7C3AED">HTTPS</text>

  <defs>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/></marker>
    <marker id="a-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F97316"/></marker>
    <marker id="a-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7C3AED"/></marker>
